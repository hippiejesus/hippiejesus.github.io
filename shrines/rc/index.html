            html,body{width:100%;}
            a {text-decoration: none;}
            .content {
                width: 100%;
                max-width: 1440px;
            }
            .grid-homepage {
                display:grid;
                grid-template-columns: 1fr 1fr 1fr;
                grid-template-rows: 3fr 2fr 1fr;
                gap: 3em;
                grid-template-areas:
                "box-1 box-1 box-1"
                "box-2 box-3 box-4"
                "box-5 box-6 box-7";
            }
            .carousel {
                width: 100%;
                min-width: 640px;
                display: flex;
                overflow-x: scroll;
                scroll-snap-type: x mandatory;
                overscroll-behavior-x: contain;
            }
            .carousel div{
                scroll-snap-align: start;
            }
            .card {
                flex-shrink: 0;
                flex-grow: 0;
                width: 100%;
                margin:0;
                padding:0;
                text-align: center;
                align-content: center;
            }
            .card img {
                width: 100%;
            }
            @keyframes spin {
                from {translate: 0;}
                to {translate: -100%;}
            }
            .socialsNav {
                padding: 25px 40px 0;
            }
            .socialsNav svg{
                height: 9px;
                width: 9px;
                transition: fill 150ms ease;
                fill: white;
            }
            .socialsNav a{
                display: flex;
                justify-content: center;
                align-items: center;
                width: 17px;
                height: 17px;
                margin-bottom: 10px;
                border-radius: 3px;
                background: rgba(17,17,17,.75);
            }
            .socialsNav a:hover{
                background: #212121;
            }
        </style>
